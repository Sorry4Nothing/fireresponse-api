$kind: http-request
name: "PUT /api/v1/admin/einheiten/:einheitId/termine/:id"
order: 94000
method: PUT
url: "{{baseUrl}}/api/v1/admin/einheiten/{{einheit_jfA}}/termine/{{programmId}}"
headers:
  - key: "Cookie"
    value: "{{cookie}}"
  - key: "expo-origin"
    value: "{{expoOrigin}}"
  - key: "X-Forwarded-For"
    value: "{{ip}}"
  - key: "X-App-Version"
    value: "{{appVersion}}"
  - key: "Content-Type"
    value: "application/json"
body:
  type: json
  content: |-
    {
      "nurLeitende": false
    }
