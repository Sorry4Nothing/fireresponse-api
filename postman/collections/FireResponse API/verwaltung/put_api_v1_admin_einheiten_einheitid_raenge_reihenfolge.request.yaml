$kind: http-request
name: "PUT /api/v1/admin/einheiten/:einheitId/raenge/reihenfolge"
order: 69000
method: PUT
url: "{{baseUrl}}/api/v1/admin/einheiten/{{einheit_jfA}}/raenge/reihenfolge"
headers:
  - key: "Cookie"
    value: "{{cookie}}"
  - key: "expo-origin"
    value: "{{expoOrigin}}"
  - key: "X-Forwarded-For"
    value: "{{ip}}"
  - key: "X-App-Version"
    value: "{{appVersion}}"
  - key: "Content-Type"
    value: "application/json"
body:
  type: json
  content: |-
    {
      "ids": [
        "{{rangId}}",
        "{{abzeichenRangId}}",
        "{{bildRangId}}"
      ]
    }
