$kind: http-request
name: "GET /api/v1/admin/einheiten/:einheitId/raenge"
order: 73000
method: GET
url: "{{baseUrl}}/api/v1/admin/einheiten/{{einheit_jfA}}/raenge"
headers:
  - key: "Cookie"
    value: "{{cookie}}"
  - key: "expo-origin"
    value: "{{expoOrigin}}"
  - key: "X-Forwarded-For"
    value: "{{ip}}"
  - key: "X-App-Version"
    value: "{{appVersion}}"
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      const liste = pm.response.code === 200 ? pm.response.json().raenge.map((rang) => rang.id) : ["00000000-0000-4000-8000-000000000000"];
      pm.environment.set("rangIds", JSON.stringify(liste));
