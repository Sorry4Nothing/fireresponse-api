$kind: http-request
name: "PUT /api/v1/infokanaele/:einheitId/mitteilungen/:id"
order: 50000
method: PUT
url: "{{baseUrl}}/api/v1/infokanaele/{{einheit_jfA}}/mitteilungen/{{mitteilungId}}"
headers:
  - key: "Cookie"
    value: "{{cookie}}"
  - key: "expo-origin"
    value: "{{expoOrigin}}"
  - key: "X-Forwarded-For"
    value: "{{ip}}"
  - key: "X-App-Version"
    value: "{{appVersion}}"
  - key: "Content-Type"
    value: "application/json"
body:
  type: json
  content: |-
    {
      "text": "Matrix"
    }
