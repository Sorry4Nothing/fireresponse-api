          type: integer
    AdminSystemRequests:
      type: object
      additionalProperties: false
      required:
        [
          seit,
          gesamt,
          letzteMinute,
          letzteStunde,
          statusklassen,
          quote5xx,
          quote4xx,
          p50Ms,
          p95Ms,
          stunden,
          minuten,
          routen,
          letzteFehler,
        ]
      properties:
        seit:
          type: string
          format: date-time
