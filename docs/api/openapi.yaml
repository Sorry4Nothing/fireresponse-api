          pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
        text:
          type: string
          minLength: 1
          maxLength: 150
        beschreibung:
          type:
            - string
            - "null"
          minLength: 1
          maxLength: 300
          description: "`null` entfernt die Beschreibung."
        aktiv:
          type: boolean
    AdminZeitregel:
      type: object
