  /api/v1/admin/einheiten/{einheitId}/import/vorschau:
    post:
      operationId: vorschauAdminImport
      summary: Vorschau des CSV-Imports
      tags:
        - Verwaltung
      description: |
        Kommando, Stellvertretungen und Kantonsadmin, nur für die Einheit im Pfad. Die Verwaltung liest die CSV-Datei im Browser und schickt die Zeilen als JSON (höchstens 200).
        Die Vorschau schreibt nichts. Sie vergleicht mit dem Bestand der Einheit (ohne Unterschied bei Gross- und Kleinschreibung, Akzenten und Leerzeichen) und nennt je Zeile den Status
        `neu`, `vorhanden` (die Person gibt es schon), `doppelt` (weiter oben in der Datei), `ungueltig` oder `ausgelassen`, dazu den vorgeschlagenen Benutzernamen des neuen Kontos.
        Geschwister mit demselben Elternteil in der Datei teilen ein Elternkonto (`gleicheEltern`: Nummer der ersten Zeile). Die Antwort enthält keine Namen.

        Statuscodes: 200, 400, 401, 403, 404, 426, 429.
      parameters:
        - $ref: "#/components/parameters/AppVersion"
        - $ref: "#/components/parameters/EinheitIdPfad"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminImport"
      responses:
        "200":
          description: Plan je Zeile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminImportVorschau"
        "400":
          $ref: "#/components/responses/UngueltigeEingabe400"
        "401":
          $ref: "#/components/responses/NichtAngemeldet401"
        "403":
          $ref: "#/components/responses/KeineBerechtigung403"
        "404":
          $ref: "#/components/responses/NichtGefunden404"
        "426":
          $ref: "#/components/responses/AppVeraltet426"
        "429":
          $ref: "#/components/responses/ZuVieleAnfragen429"
  /api/v1/admin/einheiten/{einheitId}/import:
    post:
      operationId: importiereAdmin
      summary: Teilnehmende und Eltern importieren
      tags:
        - Verwaltung
      description: |
        Gleiche Rechte und Eingabe wie die Vorschau. Der Server liest den Bestand neu (dem Browser glaubt er nicht) und legt alle Zeilen mit Status `neu` in einer Transaktion an:
        Personen, Konten mit Startpasswort und die Verknüpfungen. Zwei gleichzeitige Importe derselben Einheit laufen nacheinander. Ein zweiter Lauf mit derselben Datei legt nichts mehr an.
        Die Antwort nennt je neues Konto Name, Benutzername und Startpasswort; das Startpasswort steht nur hier.

        Statuscodes: 201, 400, 401, 403, 404, 409 (`BENUTZERNAME_VERGEBEN`), 426, 429.
      parameters:
        - $ref: "#/components/parameters/AppVersion"
        - $ref: "#/components/parameters/EinheitIdPfad"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminImport"
      responses:
        "201":
          description: Importiert.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminImportErgebnis"
        "400":
          $ref: "#/components/responses/UngueltigeEingabe400"
        "401":
          $ref: "#/components/responses/NichtAngemeldet401"
        "403":
          $ref: "#/components/responses/KeineBerechtigung403"
        "404":
          $ref: "#/components/responses/NichtGefunden404"
        "409":
          $ref: "#/components/responses/AdminKonflikt409"
        "426":
          $ref: "#/components/responses/AppVeraltet426"
        "429":
          $ref: "#/components/responses/ZuVieleAnfragen429"
  /api/v1/admin/system/changes:
    get:
      operationId: listeAdminAenderungen
      summary: Protokoll der Änderungen lesen
      tags:
        - Verwaltung
      description: |
        Nur das Konto des Kantonsadmins (mit zweitem Faktor). Das Audit-Log, neueste Einträge zuerst, seitenweise: `limit` (1 bis 200, Standard 50) und `vor` (die ID des letzten Eintrags der vorigen Seite; `weiter` der Antwort).
        Das Log enthält feste Aktionsnamen, IDs und Flags, nie Namen, Passwörter oder Eingaben. Die Namen der Akteure und Einheiten kommen erst beim Lesen dazu; ein gelöschtes Konto hat keinen Namen mehr. `akteur.cli` ist wahr für Aktionen der Kommandozeile (kein Konto).

        Statuscodes: 200, 400, 401, 403, 426, 429.
      parameters:
        - $ref: "#/components/parameters/AppVersion"
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: vor
          in: query
          required: false
          description: ID des letzten Eintrags der vorigen Seite.
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Eine Seite des Protokolls.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAenderungen"
        "400":
          $ref: "#/components/responses/UngueltigeEingabe400"
        "401":
          $ref: "#/components/responses/NichtAngemeldet401"
        "403":
          $ref: "#/components/responses/KeineBerechtigung403"
        "426":
          $ref: "#/components/responses/AppVeraltet426"
        "429":
          $ref: "#/components/responses/ZuVieleAnfragen429"
  /api/v1/admin/system/sync:
    get:
      operationId: holeAdminSync
      summary: Sync-Stand je Einheit lesen
      tags:
        - Verwaltung
      description: |
        Nur das Konto des Kantonsadmins (mit zweitem Faktor). Je Einheit, ob ein Link hinterlegt ist, wann der Sync zuletzt gelungen ist (`syncOkAm`) und der Fehlercode des letzten Laufs (`syncFehler`). Nie der Link selbst. Nur Anzeige: Einen manuellen Sync gibt es nicht.

        Statuscodes: 200, 401, 403, 426, 429.
      parameters:
        - $ref: "#/components/parameters/AppVersion"
      responses:
        "200":
          description: Stand je Einheit.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSync"
        "401":
          $ref: "#/components/responses/NichtAngemeldet401"
        "403":
          $ref: "#/components/responses/KeineBerechtigung403"
        "426":
          $ref: "#/components/responses/AppVeraltet426"
        "429":
          $ref: "#/components/responses/ZuVieleAnfragen429"
  /api/v1/admin/einheiten/{einheitId}/personen:
    get:
      operationId: listeAdminPersonen
      summary: Konten mit Rolle in der Einheit auflisten
      tags:
        - Verwaltung
      description: |
        Kommando, Stellvertretungen und Kantonsadmin (mit zweitem Faktor). Kommando, Stellvertretungen und Leitende der Einheit mit Zustand (zweiter Faktor, offenes Startpasswort mit Ablaufdatum, deaktiviert) und `aktionen`: was der Akteur an diesem Konto darf. Die Verwaltung zeigt nur Knöpfe für erlaubte Aktionen. Nie ein Passwort; das Startpasswort liefert nur sein eigener Abruf.

        Statuscodes: 200, 401, 403, 404, 426, 429.
      parameters:
        - $ref: "#/components/parameters/AppVersion"
        - $ref: "#/components/parameters/EinheitIdPfad"
      responses:
        "200":
          description: Konten der Einheit.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminPersonenListe"
        "401":
          $ref: "#/components/responses/NichtAngemeldet401"
        "403":
          $ref: "#/components/responses/KeineBerechtigung403"
        "404":
          $ref: "#/components/responses/NichtGefunden404"
        "426":
          $ref: "#/components/responses/AppVeraltet426"
        "429":
          $ref: "#/components/responses/ZuVieleAnfragen429"
  /api/v1/admin/einheiten/{einheitId}/personen/{userId}:
    patch:
      operationId: aendereAdminPerson
      summary: Name, Telefon oder Rang eines Kontos ändern
      tags:
        - Verwaltung
      description: |
        Kommando, Stellvertretungen und Kantonsadmin (mit zweitem Faktor), nur in der Einheit im Pfad. Konten, die auch zu einer anderen Einheit gehören, ändert nur der Kantonsadmin (409 `KONTO_GEMEINSAM`). Das Kommando ändert nur der Kantonsadmin, eine Stellvertretung nur das Kommando oder der Kantonsadmin (sonst 403). Am eigenen Konto: 409 `EIGENES_KONTO`. Die Aktion steht im Audit-Log ohne Passwort und ohne Namen.
        Der Rang ist die einzige Änderung, die jede Person der Verwaltung an jedem Konto der Einheit darf (auch am eigenen und am Kommando); er hängt an der Rolle, Eltern haben keinen. Eine Nummer speichern nur Kommando und Stellvertretungen, entfernen geht immer (`""`). Der Name einer Person mit eigenem Konto ändert sich bei den Teilnehmenden (sonst 400).

        Statuscodes: 204, 400, 401, 403, 404, 409, 426, 429.
      parameters:
        - $ref: "#/components/parameters/AppVersion"
        - $ref: "#/components/parameters/EinheitIdPfad"
