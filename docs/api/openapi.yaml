      description: |
        Kommando, Stellvertretungen und Kantonsadmin, nur für Personen der Einheit im Pfad. Der Elternteil ist ein neues Konto (mit Startpasswort) oder ein bestehendes (`bestehendesKonto`).
        Antwortet die Person selbst, ist das 409 `SELBST_ANTWORTET`; dasselbe Konto zweimal ist 409 `SCHON_VERKNUEPFT`.

