  /api/v1/admin/einheiten/{einheitId}/teilnehmende:
    get:
      operationId: listeAdminTeilnehmende
      summary: Teilnehmende der Einheit mit ihren Konten auflisten
      tags:
        - Verwaltung
      description: |
        Kommando, Stellvertretungen und Kantonsadmin (mit zweitem Faktor). Alle Personen der Einheit (auch inaktive) mit Rang und den Konten, die für sie antworten. Eine Person ohne Konto hat `konten: []`: Für sie antwortet niemand («keine Eltern»). Je Konto Zustand und `aktionen` wie bei `GET .../personen`; die Aktionen selbst laufen über `/personen/{userId}`.

        Statuscodes: 200, 401, 403, 404, 426, 429.
      parameters:
        - $ref: "#/components/parameters/AppVersion"
        - $ref: "#/components/parameters/EinheitIdPfad"
      responses:
        "200":
          description: Teilnehmende.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminTeilnehmendeListe"
        "401":
          $ref: "#/components/responses/NichtAngemeldet401"
        "403":
          $ref: "#/components/responses/KeineBerechtigung403"
        "404":
          $ref: "#/components/responses/NichtGefunden404"
        "426":
          $ref: "#/components/responses/AppVeraltet426"
        "429":
          $ref: "#/components/responses/ZuVieleAnfragen429"
    post:
      operationId: legeAdminTeilnehmendeAn
      summary: Teilnehmende mit Eltern oder eigenem Konto anlegen
      tags:
        - Verwaltung
      description: |
        Kommando, Stellvertretungen und Kantonsadmin (mit zweitem Faktor), nur in der Einheit im Pfad. Das Kommando legt beim Anlegen fest, wer antwortet:
        `antwort.art = eltern` (Eltern antworten, null bis vier Elternteile) oder `selbst` (die Person bekommt ein eigenes Konto mit ihrem Namen).
        Ein Elternteil ist ein neues Konto (mit Startpasswort) oder ein bestehendes Konto (`bestehendesKonto`, der Benutzername): So hat ein Elternteil mit Kindern in mehreren Einheiten ein Konto.
        Ein bestehendes Konto muss aktiv sein und darf weder dem Kantonsadmin gehören noch selbst für eine Person antworten (sonst 400).
        Pro Person antworten die Eltern oder die Person selbst, nie beide. Alles geschieht in einer Transaktion. Der Rang muss zur Einheit gehören (sonst 400).

        Statuscodes: 201, 400, 401, 403, 404, 409 (`BENUTZERNAME_VERGEBEN`, `SCHON_VERKNUEPFT`), 426, 429.
      parameters:
        - $ref: "#/components/parameters/AppVersion"
        - $ref: "#/components/parameters/EinheitIdPfad"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminTeilnehmendeAnlegen"
      responses:
        "201":
          description: Person und Konten angelegt.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminTeilnehmendeAngelegt"
        "400":
          $ref: "#/components/responses/UngueltigeEingabe400"
        "401":
          $ref: "#/components/responses/NichtAngemeldet401"
        "403":
          $ref: "#/components/responses/KeineBerechtigung403"
        "404":
          $ref: "#/components/responses/NichtGefunden404"
        "409":
          $ref: "#/components/responses/AdminKonflikt409"
        "426":
          $ref: "#/components/responses/AppVeraltet426"
        "429":
          $ref: "#/components/responses/ZuVieleAnfragen429"
  /api/v1/admin/einheiten/{einheitId}/teilnehmende/{teilnehmendeId}/eltern:
    post:
      operationId: legeAdminElternAn
      summary: Elternteil zu einer Person hinzufügen
      tags:
