  /api/v1/admin/einheiten/{einheitId}/personen/{userId}/startpasswort:
    get:
      operationId: zeigeAdminStartpasswort
      summary: Offenes Startpasswort anzeigen
      tags:
        - Verwaltung
      description: |
        Kommando, Stellvertretungen und Kantonsadmin (mit zweitem Faktor), nur in der Einheit im Pfad. Konten, die auch zu einer anderen Einheit gehören, ändert nur der Kantonsadmin (409 `KONTO_GEMEINSAM`). Das Kommando ändert nur der Kantonsadmin, eine Stellvertretung nur das Kommando oder der Kantonsadmin (sonst 403). Am eigenen Konto: 409 `EIGENES_KONTO`. Die Aktion steht im Audit-Log ohne Passwort und ohne Namen.
        Gibt das Startpasswort zurück, solange es offen und gültig ist (7 Tage). Ist keines mehr offen, antwortet die Route 409 `KEIN_STARTPASSWORT`; dann erzeugt `POST` ein neues. Das Anzeigen steht im Audit-Log.

        Statuscodes: 200, 400, 401, 403, 404, 409, 426, 429.
      parameters:
        - $ref: "#/components/parameters/AppVersion"
        - $ref: "#/components/parameters/EinheitIdPfad"
        - $ref: "#/components/parameters/AdminUserIdPfad"
      responses:
        "200":
          description: Startpasswort.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminStartpasswort"
        "400":
          $ref: "#/components/responses/UngueltigeEingabe400"
        "401":
          $ref: "#/components/responses/NichtAngemeldet401"
        "403":
          $ref: "#/components/responses/KeineBerechtigung403"
        "404":
          $ref: "#/components/responses/NichtGefunden404"
        "409":
          $ref: "#/components/responses/AdminKonflikt409"
        "426":
          $ref: "#/components/responses/AppVeraltet426"
        "429":
          $ref: "#/components/responses/ZuVieleAnfragen429"
    post:
      operationId: setzeAdminStartpasswortNeu
      summary: Neues Startpasswort erzeugen
      tags:
        - Verwaltung
      description: |
        Kommando, Stellvertretungen und Kantonsadmin (mit zweitem Faktor), nur in der Einheit im Pfad. Konten, die auch zu einer anderen Einheit gehören, ändert nur der Kantonsadmin (409 `KONTO_GEMEINSAM`). Das Kommando ändert nur der Kantonsadmin, eine Stellvertretung nur das Kommando oder der Kantonsadmin (sonst 403). Am eigenen Konto: 409 `EIGENES_KONTO`. Die Aktion steht im Audit-Log ohne Passwort und ohne Namen.
        Setzt ein neues Startpasswort (7 Tage gültig), beendet alle Sitzungen des Kontos (und löscht damit seine Push-Tokens) und verlangt beim nächsten Login einen Passwortwechsel. Die Antwort enthält das Startpasswort einmal; es lässt sich danach mit `GET` wieder anzeigen, solange es offen ist.

        Statuscodes: 200, 400, 401, 403, 404, 409, 426, 429.
      parameters:
        - $ref: "#/components/parameters/AppVersion"
        - $ref: "#/components/parameters/EinheitIdPfad"
        - $ref: "#/components/parameters/AdminUserIdPfad"
      responses:
        "200":
          description: Neues Startpasswort.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminStartpasswort"
        "400":
          $ref: "#/components/responses/UngueltigeEingabe400"
        "401":
          $ref: "#/components/responses/NichtAngemeldet401"
        "403":
          $ref: "#/components/responses/KeineBerechtigung403"
        "404":
          $ref: "#/components/responses/NichtGefunden404"
        "409":
          $ref: "#/components/responses/AdminKonflikt409"
        "426":
          $ref: "#/components/responses/AppVeraltet426"
        "429":
          $ref: "#/components/responses/ZuVieleAnfragen429"
  /api/v1/admin/einheiten/{einheitId}/personen/{userId}/deaktivieren:
    post:
      operationId: deaktiviereAdminPerson
      summary: Konto deaktivieren
      tags:
        - Verwaltung
      description: |
        Kommando, Stellvertretungen und Kantonsadmin (mit zweitem Faktor), nur in der Einheit im Pfad. Konten, die auch zu einer anderen Einheit gehören, ändert nur der Kantonsadmin (409 `KONTO_GEMEINSAM`). Das Kommando ändert nur der Kantonsadmin, eine Stellvertretung nur das Kommando oder der Kantonsadmin (sonst 403). Am eigenen Konto: 409 `EIGENES_KONTO`. Die Aktion steht im Audit-Log ohne Passwort und ohne Namen.
        Das Konto kann sich nicht mehr anmelden; alle Sitzungen enden, das Profilbild wird gelöscht. Wiederholen ist ein No-op (204).

