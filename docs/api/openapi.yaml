  /api/v1/admin/einheiten/{einheitId}/raenge/{rangId}/abzeichen:
    get:
      operationId: holeAdminRangAbzeichen
      summary: Eigenes Abzeichen eines Rangs lesen
      tags:
        - Verwaltung
      description: |
        Kommando, Stellvertretungen und Kantonsadmin (mit zweitem Faktor). Das gespeicherte, bereinigte Bild. Die Antwort trägt `Content-Security-Policy: default-src 'none'; style-src 'unsafe-inline'; sandbox` und `X-Content-Type-Options: nosniff`, damit auch ein SVG nie als Seite läuft. 404 ohne eigenes Bild.

        Statuscodes: 200, 401, 403, 404, 426, 429.
      parameters:
        - $ref: "#/components/parameters/AppVersion"
        - $ref: "#/components/parameters/EinheitIdPfad"
        - $ref: "#/components/parameters/AdminRangIdPfad"
      responses:
        "200":
          description: Das Bild.
          content:
            image/svg+xml:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/NichtAngemeldet401"
        "403":
          $ref: "#/components/responses/KeineBerechtigung403"
        "404":
          $ref: "#/components/responses/NichtGefunden404"
        "426":
          $ref: "#/components/responses/AppVeraltet426"
        "429":
          $ref: "#/components/responses/ZuVieleAnfragen429"
    put:
      operationId: setzeAdminRangAbzeichen
      summary: Eigenes Abzeichen hochladen
      tags:
        - Verwaltung
      description: |
        Kommando, Stellvertretungen und Kantonsadmin (mit zweitem Faktor). Der Body ist das Bild selbst, SVG oder PNG, höchstens 500 KB (sonst 413); der Typ ergibt sich aus den Bytes, nie aus dem Header. Hochformat im Verhältnis 100:130, bei PNG mindestens 200 × 260 und höchstens 4000 × 5200 Pixel.

        Der Server prüft und bereinigt (SR-23): Ein SVG bleibt als Baum aus erlaubten Elementen und Attributen erhalten; Skripte, Ereignis-Attribute, `style`, Bilder, `foreignObject`, Verweise nach aussen, DOCTYPE und Entitäten fallen weg oder machen die Datei ungültig. Ein PNG behält nur die Blöcke, die zum Bild gehören (keine Texte, kein EXIF). Gespeichert wird das Ergebnis, nie die Eingabe; es ersetzt Sterne und ein früheres Bild. Ein ungültiges Bild ist 415 `ABZEICHEN_UNGUELTIG` mit einer deutschen Meldung.

        Statuscodes: 204, 400, 401, 403, 404, 413, 415, 426, 429.
      parameters:
        - $ref: "#/components/parameters/AppVersion"
        - $ref: "#/components/parameters/EinheitIdPfad"
        - $ref: "#/components/parameters/AdminRangIdPfad"
      requestBody:
        required: true
        content:
          image/svg+xml:
            schema:
              type: string
              format: binary
          image/png:
            schema:
              type: string
              format: binary
      responses:
        "204":
          description: Gespeichert.
        "400":
          $ref: "#/components/responses/UngueltigeEingabe400"
        "401":
          $ref: "#/components/responses/NichtAngemeldet401"
        "403":
          $ref: "#/components/responses/KeineBerechtigung403"
        "404":
          $ref: "#/components/responses/NichtGefunden404"
        "413":
          description: Die Datei ist grösser als 500 KB (code ZU_GROSS).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Fehler"
        "415":
          description: Die Datei ist kein gültiges SVG oder PNG (code ABZEICHEN_UNGUELTIG).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Fehler"
        "426":
          $ref: "#/components/responses/AppVeraltet426"
        "429":
          $ref: "#/components/responses/ZuVieleAnfragen429"
    delete:
      operationId: entferneAdminRangAbzeichen
      summary: Abzeichen entfernen
      tags:
        - Verwaltung
      description: |
        Kommando, Stellvertretungen und Kantonsadmin (mit zweitem Faktor). Entfernt Sterne und eigenes Bild: Der Rang hat danach kein Abzeichen.

        Statuscodes: 204, 401, 403, 404, 426, 429.
      parameters:
        - $ref: "#/components/parameters/AppVersion"
        - $ref: "#/components/parameters/EinheitIdPfad"
        - $ref: "#/components/parameters/AdminRangIdPfad"
      responses:
        "204":
          description: Entfernt.
        "401":
          $ref: "#/components/responses/NichtAngemeldet401"
        "403":
          $ref: "#/components/responses/KeineBerechtigung403"
        "404":
          $ref: "#/components/responses/NichtGefunden404"
        "426":
          $ref: "#/components/responses/AppVeraltet426"
        "429":
          $ref: "#/components/responses/ZuVieleAnfragen429"
components:
  schemas:
    Fehler:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          examples:
            - NICHT_ANGEMELDET
        message:
          type: string
          examples:
            - Nicht angemeldet
    AuthAnmeldungAnfrage:
      type: object
      description: Zugangsdaten. Weitere Felder von better-auth (`rememberMe`, `callbackURL`) verwendet die App nicht.
      required:
        - username
        - password
      properties:
        username:
          type: string
          maxLength: 64
          pattern: ^[A-Za-z0-9._-]+$
          description: |
            Benutzername. Erlaubt sind Buchstaben, Ziffern, Punkt, Unterstrich und Bindestrich (3 bis 64 Zeichen);
            Gross-/Kleinschreibung ist egal, gespeichert wird kleingeschrieben. Ein Wert ausserhalb der Regel
            ergibt wie jeder Fehlschlag 401.
          example: vorname.nachname
        password:
          type: string
          description: Passwort oder Startpasswort. Bei offenem Startpasswort zählen Gross-/Kleinschreibung, Bindestriche und Leerzeichen nicht.
    AuthBenutzer:
      type: object
      description: |
        Person aus better-auth. Die E-Mail-Adresse ist ein Platzhalter (`…@benutzer.invalid`) und nicht für die
        Anzeige gedacht. Weitere Felder (z. B. Bremsfelder, `createdAt`, `emailVerified`) können vorkommen;
        die App ignoriert sie. Das vollständige Profil liefert `GET /api/v1/ich`.
      required:
        - id
        - name
      additionalProperties: true
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          description: Anzeigename.
        username:
          type:
            - string
            - "null"
          description: Benutzername, kleingeschrieben.
        role:
          type:
            - string
            - "null"
          description: Rolle der Person bei better-auth; `admin` für Admins.
          example: admin
        twoFactorEnabled:
          type:
            - boolean
            - "null"
          description: Ob der zweite Faktor eingerichtet und bestätigt ist.
        mussPasswortAendern:
          type: boolean
          description: |
            Ob der Pflichtwechsel des Passworts offen ist. Dann antwortet jede Route unter `/api/v1` ausser
            `GET /api/v1/ich` mit 403.
    AuthSitzung:
      type: object
      description: Sitzung. Das Sitzungstoken ist kein Bearer-Token und gehört nicht in die App-Logik.
      required:
        - id
        - userId
        - expiresAt
      additionalProperties: true
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        expiresAt:
          type: string
          format: date-time
          description: Ablauf der Sitzung (90 Tage ab der letzten Verlängerung).
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    AuthAnmeldungErfolg:
      type: object
      description: Angemeldet. Das Session-Cookie steht im `Set-Cookie`-Header.
      required:
        - user
      additionalProperties: true
      properties:
        redirect:
          type: boolean
          description: Immer `false` (die App schickt keine `callbackURL`).
        token:
          type: string
          description: Sitzungstoken; nicht als Bearer-Token verwendbar. Massgeblich ist das Cookie.
        user:
          $ref: "#/components/schemas/AuthBenutzer"
    AuthZweiterFaktorAufforderung:
      type: object
      description: |
        Zweiter Faktor verlangt. Es gibt noch keine Sitzung; das Zwischen-Cookie `two_factor` steht im `Set-Cookie`-Header.
      required:
        - twoFactorRedirect
        - twoFactorMethods
      properties:
        twoFactorRedirect:
          type: boolean
          enum:
            - true
        twoFactorMethods:
          type: array
          description: Verfügbare Methoden; heute nur `totp` (Ersatzcodes gehen immer).
          items:
            type: string
            enum:
              - totp
    AuthSitzungAntwort:
      type: object
      required:
        - session
        - user
      properties:
        session:
          $ref: "#/components/schemas/AuthSitzung"
        user:
          $ref: "#/components/schemas/AuthBenutzer"
    AuthAbmeldenAntwort:
      type: object
      required:
        - success
      properties:
        success:
          type: boolean
          enum:
            - true
    AuthAlleSitzungenBeendenAntwort:
      type: object
      required:
        - status
      properties:
        status:
          type: boolean
          enum:
            - true
    AuthPasswortAendernAnfrage:
      type: object
      required:
        - currentPassword
        - newPassword
      description: |
        Weitere Felder von better-auth (`revokeOtherSessions`) setzt der Server selbst auf `true`.
      properties:
        currentPassword:
          type: string
          maxLength: 128
          description: Aktuelles Passwort, bei offenem Pflichtwechsel das Startpasswort (Schreibweise egal).
        newPassword:
          type: string
          minLength: 12
          maxLength: 128
          description: Neues Passwort. Muss sich vom bisherigen unterscheiden und darf nicht aus einem bekannten Datenleck stammen.
    AuthPasswortAendernAntwort:
      type: object
      required:
        - token
        - user
      properties:
        token:
          type:
            - string
            - "null"
          description: Token der neuen Sitzung; nicht als Bearer-Token verwendbar. Massgeblich ist das neue Cookie.
        user:
          $ref: "#/components/schemas/AuthBenutzer"
    AuthZweiterFaktorEinrichtenAnfrage:
      type: object
      required:
        - password
      properties:
        password:
          type: string
          description: Aktuelles Passwort der Person (bei offenem Startpasswort Schreibweise egal).
        method:
          type: string
          enum:
            - totp
            - otp
          default: totp
          description: Nur `totp` ist verfügbar; `otp` ergibt 400 `OTP_NOT_CONFIGURED`.
    AuthZweiterFaktorEinrichtenAntwort:
      type: object
      required:
        - method
        - totpURI
        - backupCodes
      properties:
        method:
          type: string
          enum:
            - totp
        totpURI:
          type: string
          description: |
            `otpauth://totp/FireResponse:<benutzername>?secret=<BASE32>&issuer=FireResponse&digits=6&period=30`.
            Enthält das Geheimnis; als QR-Code oder Link an die Authenticator-App übergeben, nie speichern oder loggen.
          example: otpauth://totp/FireResponse:vorname.nachname?secret=JBSWY3DPEHPK3PXP&issuer=FireResponse&digits=6&period=30
        backupCodes:
          type: array
          minItems: 10
          maxItems: 10
          description: Zehn Ersatzcodes; nur jetzt sichtbar. Jeder gilt einmal.
          items:
            type: string
            pattern: ^[a-zA-Z0-9]{5}-[a-zA-Z0-9]{5}$
            example: abc12-xyz34
    AuthCodeAnfrage:
      type: object
      required:
        - code
      description: Das Feld `trustDevice` von better-auth ignoriert der Server.
      properties:
        code:
          type: string
          description: |
            Sechsstelliger TOTP-Code (`verify-totp`, z. B. «012345») oder Ersatzcode im Format `xxxxx-xxxxx`
            (`verify-backup-code`).
          example: "012345"
    AuthZweiterFaktorAnmeldeAntwort:
      type: object
      required:
        - token
        - user
      description: Das neue Session-Cookie steht im `Set-Cookie`-Header.
      properties:
        token:
          type: string
          description: Sitzungstoken; nicht als Bearer-Token verwendbar.
        user:
          $ref: "#/components/schemas/AuthBenutzer"
    IchProfil:
      type: object
      description: Das eigene Profil. `pushAnmeldungen` fehlt bei Personen ohne Rolle in einer Einheit.
      required:
        - id
        - name
        - benutzername
        - kantonsadmin
        - zweiterFaktor
        - einwilligung
        - mussPasswortAendern
        - telefon
        - bildUrl
        - pushProgramme
        - einheiten
        - teilnehmende
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        benutzername:
          type: string
          description: 3 bis 64 Zeichen aus Buchstaben, Ziffern, Punkt, Unterstrich und Bindestrich, kleingeschrieben gespeichert.
        kantonsadmin:
          type: boolean
        zweiterFaktor:
          type: boolean
        einwilligung:
          type: boolean
          description: Hat die Person der aktuellen Fassung der Einwilligung zugestimmt? Sonst sperrt die API die App-Routen.
        mussPasswortAendern:
          type: boolean
        telefon:
          type:
            - string
            - "null"
        bildUrl:
          type:
            - string
            - "null"
          description: Pfad zum Profilbild oder `null`.
        pushProgramme:
          type: boolean
        pushAnmeldungen:
          type: boolean
        einheiten:
          type: array
          items:
            $ref: "#/components/schemas/IchEinheit"
        teilnehmende:
          type: array
          items:
            $ref: "#/components/schemas/IchTeilnehmende"
    IchEinstellungen:
      type: object
      additionalProperties: false
      minProperties: 1
      description: Mindestens ein Feld. Fremde Felder ergeben 400.
      properties:
        pushProgramme:
          type: boolean
        pushAnmeldungen:
          type: boolean
        telefon:
          type:
            - string
            - "null"
          maxLength: 30
          description: Eigene Telefonnummer, nur für SL; leerer Text oder `null` entfernt sie.
    TeilnahmenZahlen:
      type: object
      required: [ja, nein, offen]
      properties:
        ja:
          type: integer
        nein:
          type: integer
        offen:
          type: integer
    TeilnahmenUebersicht:
      type: object
      required: [zahlen, teilnehmende, leitende]
      properties:
        zahlen:
          type: object
          required: [teilnehmende, leitende]
          properties:
            teilnehmende:
              $ref: "#/components/schemas/TeilnahmenZahlen"
            leitende:
              $ref: "#/components/schemas/TeilnahmenZahlen"
        teilnehmende:
          type: array
          items:
            type: object
            required: [id, vorname, nachname, status]
            properties:
              id:
                type: string
                format: uuid
              vorname:
                type: string
              nachname:
                type: string
              status:
                type: string
                enum: [ja, nein, offen]
        leitende:
          type: array
          description: Rollen der Einheit mit ihrer Anmeldung; leer für Eltern und Teilnehmende.
          items:
            type: object
            required: [id, name, bildUrl, rolle, status]
            properties:
              id:
                type: string
                format: uuid
              name:
                type: string
              bildUrl:
                type:
                  - string
                  - "null"
              rolle:
                type: string
                enum: [kommandant, stellvertretung, leitung]
              status:
                type: string
                enum: [ja, nein, offen]
    PushTokenAnfrage:
      type: object
      additionalProperties: false
      required:
        - token
        - plattform
      properties:
        token:
          type: string
          pattern: ^[\w:.-]{20,512}$
          description: FCM-Registrierungstoken des Geräts.
          example: cX1y2Z3a4B5c6D7e8F9g:APA91bxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
        plattform:
          type: string
          enum:
            - ios
            - android
    ProgrammListeneintrag:
      type: object
      description: |
        Programm, wie es Liste und Detail liefern, mit `teilnehmende` (derselben Regel in beiden). Alle Schlüssel sind immer vorhanden. Entweder ist `ganztaegig`
        wahr, dann sind `tagVon` und `tagBis` gesetzt und `beginn` und `ende` `null`, oder `ganztaegig` ist falsch,
        dann sind `beginn` und `ende` gesetzt und `tagVon` und `tagBis` `null`.
      required:
        - id
        - titel
        - status
        - ganztaegig
        - beginn
        - ende
        - tagVon
        - tagBis
        - googleOrt
        - googleBeschreibung
        - einheit
        - teilnehmende
      properties:
        id:
          type: string
          format: uuid
        titel:
          type: string
        status:
          type: string
          enum: [aktiv, abgesagt, pruefen]
        ganztaegig:
          type: boolean
        beginn:
          type:
            - string
            - "null"
          format: date-time
        ende:
          type:
            - string
            - "null"
          format: date-time
        tagVon:
          type:
            - string
            - "null"
          format: date
        tagBis:
          type:
            - string
            - "null"
          format: date
        googleOrt:
          type:
            - string
            - "null"
        googleBeschreibung:
          type:
            - string
            - "null"
          description: Nur für Kommando, Leitende und das Konto des Kantonsadmins gefüllt, sonst `null`.
        einheit:
          $ref: "#/components/schemas/ProgrammEinheit"
        teilnehmende:
          type: array
          items:
            $ref: "#/components/schemas/ProgrammTeilnehmende"
    ProgrammListe:
      type: object
      required:
        - programme
      properties:
        programme:
          type: array
          items:
            $ref: "#/components/schemas/ProgrammListeneintrag"
    ProgrammDetail:
      description: Das Programm mit dem Stand der Anmeldung.
      allOf:
        - $ref: "#/components/schemas/ProgrammListeneintrag"
        - type: object
          required: [teilnahmeOffen]
          properties:
            teilnahmeOffen:
              type: boolean
              description: Aktiv und noch nicht begonnen; nur dann lassen sich Antworten ändern.
            eigeneAnmeldung:
              type: string
              enum: [ja, nein, offen]
              description: Nur für Kommando und Leitende der Einheit.
    ProgrammAntwort:
      type: object
      description: Antwort «ja» oder «nein» für eine Teilnahme oder eine Leitungsanmeldung.
      required:
        - status
      additionalProperties: false
      properties:
        status:
          type: string
          enum:
            - ja
            - nein
    AdminKonflikt:
      type: object
      description: |
        Fehler mit Statuscode 409. Gleiche Form wie `Fehler`, aber mit eigenen Codes, die der Handler setzt. Texte sind deutsch und für die Anzeige gedacht.
      required:
        - code
        - message
      properties:
        code:
          type: string
          enum:
            - KEIN_KOMMANDANT
            - GLEICHE_PERSON
            - BENUTZERNAME_VERGEBEN
            - BEZIRK_VORHANDEN
            - EINHEIT_VORHANDEN
            - REIHENFOLGE_BELEGT
            - ELTERN_ANTWORTEN
            - SELBST_ANTWORTET
            - EIGENES_KONTO_VORHANDEN
            - SCHON_VERKNUEPFT
            - EIGENES_KONTO
            - KONTO_GEMEINSAM
            - KEIN_ZWEITER_FAKTOR
            - KEIN_STARTPASSWORT
            - RANG_REIHENFOLGE_BELEGT
            - RAENGE_VOLL
            - RANG_IN_VERWENDUNG
        message:
          type: string
          example: Diese Person ist schon Kommandantin oder Kommandant.
    AdminKontoAktionen:
      type: object
      description: Was der Akteur an diesem Konto darf. Fehlt eine Aktion, fehlt in der Verwaltung der Knopf.
      required: [bearbeiten, startpasswort, deaktivieren, zweiterFaktor]
      properties:
        bearbeiten:
          type: boolean
          description: Name und Telefon ändern.
        startpasswort:
          type: boolean
        deaktivieren:
          type: boolean
          description: Deaktivieren und Aktivieren.
        zweiterFaktor:
          type: boolean
    AdminPersonenListe:
      type: object
      required: [personen]
      properties:
        personen:
          type: array
          items:
            type: object
            required:
              [
                id,
                name,
                benutzername,
                telefon,
                rolle,
                reihenfolge,
                rang,
                zweiterFaktor,
                startpasswort,
                deaktiviert,
                eigenes,
                gemeinsam,
                aktionen,
              ]
            properties:
              id:
                type: string
                format: uuid
              name:
                type: string
              benutzername:
                type: [string, "null"]
              telefon:
                type: [string, "null"]
              rolle:
                type: string
                enum: [kommandant, stellvertretung, leitung]
              reihenfolge:
                type: [integer, "null"]
                description: Position der Stellvertretung.
              rang:
                oneOf:
                  - type: "null"
                  - type: object
                    required: [id, name]
                    properties:
                      id:
                        type: string
                        format: uuid
                      name:
                        type: string
              zweiterFaktor:
                type: boolean
              startpasswort:
                description: Offenes Startpasswort; `null`, wenn keines offen ist. Nie das Passwort selbst.
                oneOf:
                  - type: "null"
                  - type: object
                    required: [gueltigBis, abgelaufen]
                    properties:
                      gueltigBis:
                        type: [string, "null"]
                        format: date-time
                      abgelaufen:
                        type: boolean
              deaktiviert:
                type: boolean
              eigenes:
                type: boolean
                description: Das Konto des Akteurs.
              gemeinsam:
                type: boolean
                description: Das Konto gehört auch zu einer anderen Einheit; dann ändert nur der Kantonsadmin es.
              aktionen:
                $ref: "#/components/schemas/AdminKontoAktionen"
    AdminPersonAendern:
      type: object
      description: Mindestens ein Feld.
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 201
          description: «Vorname Nachname» in einem Feld.
        telefon:
          type: [string, "null"]
          description: Nur Kommando und Stellvertretungen; leer oder `null` entfernt die Nummer.
        rangId:
          type: [string, "null"]
          format: uuid
          description: Rang der Einheit; `null` entfernt ihn.
    AdminStartpasswort:
      type: object
      required: [startpasswort, gueltigBis]
      properties:
        startpasswort:
          type: string
          description: Gilt 7 Tage, nur für die erste Anmeldung.
        gueltigBis:
          type: [string, "null"]
          format: date-time
    AdminTeilnehmendeListe:
      type: object
      required: [teilnehmende]
      properties:
        teilnehmende:
          type: array
          items:
            type: object
            required: [id, vorname, nachname, aktiv, rang, konten]
            properties:
              id:
                type: string
                format: uuid
              vorname:
                type: string
              nachname:
                type: string
              aktiv:
                type: boolean
              rang:
                oneOf:
                  - type: "null"
                  - type: object
                    required: [id, name]
                    properties:
                      id:
                        type: string
                        format: uuid
                      name:
                        type: string
              konten:
                type: array
                description: "Leer heisst: Es antwortet niemand."
                items:
                  type: object
                  required:
                    [
                      id,
                      name,
                      benutzername,
                      art,
                      zweiterFaktor,
                      startpasswort,
                      deaktiviert,
                      eigenes,
                      gemeinsam,
                      aktionen,
                    ]
                  properties:
                    id:
                      type: string
                      format: uuid
                    name:
                      type: string
                    benutzername:
                      type: [string, "null"]
                    art:
                      type: string
                      enum: [eltern, selbst]
                    zweiterFaktor:
                      type: boolean
                    startpasswort:
                      description: Offenes Startpasswort; `null`, wenn keines offen ist. Nie das Passwort selbst.
                      oneOf:
                        - type: "null"
                        - type: object
                          required: [gueltigBis, abgelaufen]
                          properties:
                            gueltigBis:
                              type: [string, "null"]
                              format: date-time
                            abgelaufen:
                              type: boolean
                    deaktiviert:
                      type: boolean
                    eigenes:
                      type: boolean
                      description: Das Konto des Akteurs.
                    gemeinsam:
                      type: boolean
                      description: Das Konto gehört auch zu einer anderen Einheit; dann ändert nur der Kantonsadmin es.
                    aktionen:
                      $ref: "#/components/schemas/AdminKontoAktionen"
    AdminTeilnehmendeAendern:
      type: object
      description: Mindestens ein Feld.
      additionalProperties: false
      properties:
        vorname:
          type: string
          minLength: 1
          maxLength: 100
        nachname:
          type: string
          minLength: 1
          maxLength: 100
        rangId:
          type: [string, "null"]
          format: uuid
        aktiv:
          type: boolean
    AdminRaengeListe:
      type: object
      required: [raenge]
      properties:
        raenge:
          type: array
          items:
            type: object
            required:
              [id, name, kuerzel, reihenfolge, abzeichen, teilnehmende, rollen]
            properties:
              id:
                type: string
                format: uuid
              name:
                type: string
              kuerzel:
                type: string
              reihenfolge:
                type: integer
                minimum: 1
                maximum: 999
              abzeichen:
                description: Sterne, eigenes Bild oder keines.
                oneOf:
                  - type: "null"
                  - type: object
                    required: [art, sterne]
                    properties:
                      art:
                        type: string
                        enum: [sterne]
                      sterne:
                        type: integer
                        minimum: 0
                        maximum: 5
                  - type: object
                    required: [art, typ, url]
                    properties:
                      art:
                        type: string
                        enum: [bild]
                      typ:
                        type: string
                        enum: [svg, png]
                      url:
                        type: string
                        description: Pfad zum Bild (`GET .../abzeichen`), mit `?v=` als Stand des Bildes.
              teilnehmende:
                type: integer
                description: Teilnehmende mit diesem Rang.
              rollen:
                type: integer
                description: Kommando, Stellvertretungen und Leitende mit diesem Rang.
    AdminRangAnlegen:
      type: object
      required: [name, kuerzel, reihenfolge]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        kuerzel:
          type: string
          minLength: 1
          maxLength: 20
        reihenfolge:
          type: integer
          minimum: 1
          maximum: 999
        abzeichenSterne:
          type: [integer, "null"]
          minimum: 0
          maximum: 5
    AdminRangAngelegt:
      type: object
      required: [id]
      properties:
        id:
          type: string
          format: uuid
    AdminRangAendern:
      type: object
      description: Mindestens ein Feld.
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        kuerzel:
          type: string
          minLength: 1
          maxLength: 20
        reihenfolge:
          type: integer
          minimum: 1
          maximum: 999
        abzeichenSterne:
          type: [integer, "null"]
          minimum: 0
          maximum: 5
    AdminRaengeOrdnen:
      type: object
      required: [ids]
      additionalProperties: false
      properties:
        ids:
          type: array
          minItems: 1
          maxItems: 99
          uniqueItems: true
          items:
            type: string
            format: uuid
    AdminAenderungen:
      type: object
      required: [eintraege, weiter]
      properties:
        eintraege:
          type: array
          items:
            type: object
            required:
              [id, zeit, aktion, akteur, zielTyp, zielId, einheit, details]
            properties:
              id:
                type: string
                format: uuid
              zeit:
                type: string
                format: date-time
              aktion:
                type: string
                example: startpasswort_neu
              akteur:
                type: object
                required: [id, name, cli]
                properties:
                  id:
                    type: [string, "null"]
                  name:
                    type: [string, "null"]
                  cli:
                    type: boolean
              zielTyp:
                type: string
              zielId:
                type: string
                format: uuid
              einheit:
                oneOf:
                  - type: "null"
                  - type: object
                    required: [id, name, typ, bezirk]
                    properties:
                      id:
