  /api/v1/admin/einheiten/{einheitId}/teilnehmende/{teilnehmendeId}/konto-wechsel:
    post:
      operationId: wechsleAdminKonto
      summary: Konto-Wechsel Eltern → Kind
      tags:
        - Verwaltung
      description: |
        Kommando, Stellvertretungen und Kantonsadmin, nur für Personen der Einheit im Pfad. Die Familie meldet sich beim Kommando; in einer Transaktion bekommt die Person ein eigenes Konto
        mit Startpasswort und fallen die Verknüpfungen aller Elternkonten weg. Die Person setzt beim ersten Login ein eigenes Passwort.
        Danach ist die Person für die früheren Eltern unsichtbar (404 auf `PUT /api/v1/programme/{id}/teilnahmen/{teilnehmendeId}`); andere Kinder der Eltern bleiben.
        Die Elternkonten selbst bleiben bestehen. Hat die Person schon ein eigenes Konto, ist das 409 `EIGENES_KONTO_VORHANDEN`.
        Der Wechsel steht im Audit-Log.

        Statuscodes: 201, 400, 401, 403, 404, 409, 426, 429.
      parameters:
        - $ref: "#/components/parameters/AppVersion"
        - $ref: "#/components/parameters/EinheitIdPfad"
        - $ref: "#/components/parameters/AdminTeilnehmendeIdPfad"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminKontoWechsel"
      responses:
        "201":
          description: Eigenes Konto angelegt, Eltern gelöst.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminVerknuepftesKonto"
        "400":
          $ref: "#/components/responses/UngueltigeEingabe400"
        "401":
          $ref: "#/components/responses/NichtAngemeldet401"
        "403":
          $ref: "#/components/responses/KeineBerechtigung403"
        "404":
          $ref: "#/components/responses/NichtGefunden404"
        "409":
          $ref: "#/components/responses/AdminKonflikt409"
        "426":
          $ref: "#/components/responses/AppVeraltet426"
        "429":
